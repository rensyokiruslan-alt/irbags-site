<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>irbags · admin · товар</title>
  <link rel="stylesheet" href="../shared/css/fonts.css">
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <main class="a-form">

    <div class="a-form__row" id="pcColorRow" hidden>
      <label class="a-form__label" for="pcColor">цвет</label>
      <div class="a-colors">
        <input type="text" class="a-input a-colors__name" id="pcColor" placeholder="название цвета" autocomplete="off" spellcheck="false">
        <div class="a-wrap" id="pcColors"></div>
      </div>
    </div>

    <div class="a-form__row">
      <span class="a-form__label">фото</span>
      <div class="a-photos-row" id="pcPhotos"></div>
    </div>

    <div class="a-form__row">
      <label class="a-form__label" for="pcName">название <b>*</b></label>
      <input type="text" class="a-input" id="pcName" placeholder="например, сумка kelly" autocomplete="off" spellcheck="false">
    </div>

    <div class="a-form__row">
      <label class="a-form__label" for="pcCategory">категория <b>*</b></label>
      <select class="a-input a-select" id="pcCategory"></select>
    </div>

    <div class="a-form__row">
      <label class="a-form__label" for="pcPrice">цена <b>*</b></label>
      <div class="a-inline">
        <span class="a-input-wrap">
          <input type="text" class="a-input" id="pcPrice" inputmode="numeric" autocomplete="off" placeholder="0">
          <span class="a-input-wrap__suffix">руб</span>
        </span>
        <span class="a-input-wrap">
          <input type="text" class="a-input" id="pcDiscount" inputmode="numeric" autocomplete="off" placeholder="со скидкой">
          <span class="a-input-wrap__suffix">руб</span>
        </span>
        <span class="a-discount" id="pcDiscountInfo"></span>
      </div>
    </div>

    <div class="a-form__row">
      <label class="a-form__label" for="pcStock">количество</label>
      <div class="a-inline">
        <div class="a-stepper">
          <button type="button" class="a-pill a-stepper__btn" id="pcStockMinus" aria-label="меньше">−</button>
          <span class="a-input-wrap">
            <input type="number" class="a-input" id="pcStock" min="0" step="1" inputmode="numeric" value="0">
            <span class="a-input-wrap__suffix">шт</span>
          </span>
          <button type="button" class="a-pill a-stepper__btn" id="pcStockPlus" aria-label="больше">+</button>
        </div>
        <span class="a-form__note" id="pcTotal"></span>
      </div>
    </div>

    <div class="a-form__row">
      <label class="a-form__label" for="pcShortDescr">краткое описание</label>
      <textarea class="a-textarea a-textarea--short" id="pcShortDescr" spellcheck="false" placeholder="до 4 строк, показывается под ценой"></textarea>
    </div>

    <div class="a-form__row">
      <label class="a-form__label" for="pcDescr">описание <b>*</b></label>
      <textarea class="a-textarea a-textarea--long" id="pcDescr" spellcheck="false" placeholder="материалы, фурнитура, уход"></textarea>
    </div>

    <div class="a-form__row">
      <label class="a-form__label" for="pcSize">размер <b>*</b></label>
      <input type="text" class="a-input" id="pcSize" placeholder="например, 30 × 20 × 10 см" autocomplete="off" spellcheck="false">
    </div>

    <div class="a-form__row">
      <span class="a-form__label"></span>
      <button type="button" class="a-form__link" id="pcEnableColors">+ у товара есть другие цвета</button>
    </div>

  </main>

  <script src="js/scale.js"></script>
  <script src="js/common.js"></script>
  <script>Admin.requireAuth();</script>
  <script type="module" src="../shared/js/firebase-sync.js"></script>
  <script src="js/product-create.js" defer></script>
</body>
</html>
