<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>irbags · admin · товар</title>
  <link rel="stylesheet" href="../shared/css/fonts.css">
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="pe">

  <div class="pe-page">

    <div class="pe-body">

      <section class="pe-photos" aria-label="фото товара">
        <div class="pe-cover" id="pcCover"></div>
        <div class="pe-thumbs" id="pcThumbs"></div>
      </section>

      <section class="pe-form" aria-label="данные товара">

        <label class="pe-field">
          <span class="pe-label">название</span>
          <input type="text" class="pe-input" id="pcName" placeholder="сумка kelly" autocomplete="off" spellcheck="false">
        </label>

        <label class="pe-field">
          <span class="pe-label">краткое описание <i>· до 4 строк</i></span>
          <textarea class="pe-input" id="pcShortDescr" rows="1" spellcheck="false" placeholder="компактная сумка из гладкой кожи на каждый день"></textarea>
        </label>

        <div class="pe-grid3">
          <label class="pe-field">
            <span class="pe-label">цена</span>
            <span class="pe-money">
              <input type="text" id="pcPrice" inputmode="numeric" autocomplete="off" placeholder="0">
              <span class="pe-money__unit">руб</span>
            </span>
          </label>
          <label class="pe-field">
            <span class="pe-label">цена со скидкой <i>· если есть</i></span>
            <span class="pe-money">
              <input type="text" id="pcDiscount" inputmode="numeric" autocomplete="off" placeholder="—">
              <span class="pe-money__pct" id="pcPct" hidden></span>
              <span class="pe-money__unit">руб</span>
            </span>
            <span class="pe-error-text" id="pcDiscountError" hidden>должна быть меньше обычной цены</span>
          </label>
          <div class="pe-field">
            <label class="pe-label" id="pcStockLabel" for="pcStock">в наличии</label>
            <span class="pe-money">
              <button type="button" class="pe-money__step" id="pcStockMinus" aria-label="меньше">−</button>
              <input type="number" id="pcStock" min="0" step="1" inputmode="numeric" value="0">
              <span class="pe-money__unit">шт</span>
              <button type="button" class="pe-money__step" id="pcStockPlus" aria-label="больше">+</button>
            </span>
          </div>
        </div>

        <div class="pe-field" id="pcCategoryField">
          <span class="pe-label" id="pcCategoryLabel">категория</span>
          <div class="pe-chips" id="pcCategories" role="radiogroup" aria-labelledby="pcCategoryLabel"></div>
        </div>

        <div class="pe-field pe-colors" id="pcColorsField">
          <span class="pe-label">цвета <i>· у каждого цвета свои фото, цена и количество</i></span>
          <div class="pe-chips" id="pcColors"></div>
          <div class="pe-picker" id="pcPicker" hidden></div>
        </div>

        <label class="pe-field">
          <span class="pe-label">материалы и фурнитура</span>
          <textarea class="pe-input" id="pcDescr" rows="3" spellcheck="false" placeholder="гладкая кожа, хлопковая подкладка, латунная фурнитура, застёжка на магните"></textarea>
        </label>

        <label class="pe-field">
          <span class="pe-label">размер</span>
          <input type="text" class="pe-input" id="pcSize" placeholder="24 × 18 × 9 см, ремень 120 см" autocomplete="off" spellcheck="false">
        </label>

      </section>
    </div>
  </div>

  <script src="js/scale.js"></script>
  <script src="js/common.js"></script>
  <script>Admin.requireAuth();</script>
  <script type="module" src="../shared/js/firebase-sync.js"></script>
  <script src="js/product-create.js" defer></script>
</body>
</html>
