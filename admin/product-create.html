<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>irbags · admin · товар</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Создание: product-create.html; редактирование: product-create.html?id=ID -->
  <main class="a-editor">

    <!-- ── Фото активного цвета: 6 слотов 480×683 ─────────────────────────── -->
    <div class="a-editor__photos" id="pcPhotos"></div>

    <!-- ── Поля ────────────────────────────────────────────────────────────── -->
    <div class="a-editor__form">

      <input type="text" class="a-input a-input--lead" id="pcName" placeholder="название" autocomplete="off" spellcheck="false">

      <div class="a-block">
        <span class="a-block__label">категория</span>
        <div class="a-wrap" id="pcCategories"></div>
      </div>

      <div class="a-block">
        <span class="a-block__label">цвета</span>
        <div class="a-wrap" id="pcColors"></div>
      </div>

      <div class="a-block">
        <span class="a-block__label">название цвета</span>
        <input type="text" class="a-input" id="pcColor" placeholder="например, чёрный" autocomplete="off" spellcheck="false">
      </div>

      <div class="a-fields">
        <div class="a-block">
          <span class="a-block__label">цена, руб</span>
          <input type="text" class="a-input" id="pcPrice" inputmode="numeric" autocomplete="off" placeholder="сумма">
        </div>
        <div class="a-block">
          <span class="a-block__label">цена со скидкой, руб</span>
          <input type="text" class="a-input" id="pcDiscount" inputmode="numeric" autocomplete="off" placeholder="без скидки">
        </div>
      </div>

      <div class="a-block">
        <span class="a-block__label">количество</span>
        <div class="a-stepper">
          <button type="button" class="a-pill a-stepper__btn" id="pcStockMinus" aria-label="меньше">−</button>
          <input type="number" class="a-stepper__value" id="pcStock" min="0" step="1" inputmode="numeric" value="0" aria-label="количество">
          <button type="button" class="a-pill a-stepper__btn" id="pcStockPlus" aria-label="больше">+</button>
          <span class="a-stepper__unit">шт · у этого цвета</span>
        </div>
      </div>

      <div class="a-block">
        <span class="a-block__label">краткое описание · до 4 строк</span>
        <textarea class="a-textarea" id="pcShortDescr" rows="1" spellcheck="false"></textarea>
      </div>

      <div class="a-block">
        <span class="a-block__label">описание</span>
        <textarea class="a-textarea" id="pcDescr" rows="1" spellcheck="false" placeholder="материалы, фурнитура и прочее"></textarea>
      </div>

      <div class="a-block">
        <span class="a-block__label">размер</span>
        <input type="text" class="a-input" id="pcSize" autocomplete="off" spellcheck="false">
      </div>

    </div>
  </main>

  <script src="js/scale.js"></script>
  <script src="js/common.js"></script>
  <script>Admin.requireAuth();</script>
  <script type="module" src="../js/firebase-sync.js"></script>
  <script src="js/product-create.js" defer></script>
</body>
</html>
