<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>irbags · admin</title>
  <link rel="stylesheet" href="../shared/css/fonts.css">
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <main class="a-signin" id="signin">
    <form class="a-signin__form" id="signinForm">
      <input
        type="password"
        class="a-signin__input"
        id="signinPassword"
        placeholder="пароль"
        autocomplete="current-password"
        autocapitalize="off"
        spellcheck="false"
        aria-label="пароль"
        autofocus
      >
      <button type="submit" class="a-pill a-pill--dark">войти</button>
    </form>
  </main>

  <script src="js/scale.js"></script>
  <script src="js/common.js"></script>
  <script type="module" src="../shared/js/firebase-sync.js"></script>
  <script>
    (function () {
      // Пароль проверяет Firebase Authentication (служебная почта задана в firebase-sync.js)
      var root   = document.getElementById('signin');
      var form   = document.getElementById('signinForm');
      var input  = document.getElementById('signinPassword');
      var submit = form.querySelector('button');
      var busy   = false;

      if (Admin.isAuthed()) {
        Admin.loadDB().then(function (db) { return db && db.currentAdmin(); }).then(function (user) {
          if (user) window.location.replace('dashboard.html');
        });
      }

      input.addEventListener('input', function () { root.classList.remove('is-error'); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (busy || !input.value) return;
        busy = true;
        submit.classList.add('is-disabled');

        Admin.loadDB().then(function (db) {
          if (!db || !db.isConfigured) throw { code: 'no-db' };
          return db.signIn(input.value);
        }).then(function () {
          Admin.login();
          window.location.href = 'dashboard.html';
        }, function (err) {
          busy = false;
          submit.classList.remove('is-disabled');
          var code = err && err.code;
          if (code === 'auth/too-many-requests') Admin.toast('слишком много попыток — попробуйте позже', true);
          else if (code === 'auth/network-request-failed' || code === 'no-db') Admin.toast('нет связи с сервером', true);
          fail();
        });
      });

      function fail() {
        input.value = '';
        root.classList.remove('is-error');
        void root.offsetWidth; /* перезапуск анимации */
        root.classList.add('is-error');
        input.focus();
      }
    })();
  </script>
</body>
</html>
