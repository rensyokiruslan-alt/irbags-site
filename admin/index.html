<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>irbags · admin</title>
  <link rel="stylesheet" href="../shared/css/fonts.css">
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <main class="a-signin" id="signin">
    <form class="a-signin__form" id="signinForm">
      <input
        type="password"
        class="a-signin__input"
        id="signinPassword"
        placeholder="пароль"
        autocomplete="current-password"
        autocapitalize="off"
        spellcheck="false"
        aria-label="пароль"
        autofocus
      >
      <button type="submit" class="a-pill a-pill--dark">войти</button>
    </form>
  </main>

  <script src="js/scale.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      // TODO: клиентская проверка — перед продакшеном перенести авторизацию на сервер.
      // В коде хранится только SHA-256 пароля, не сам пароль.
      var PASSWORD_SHA256 = 'a4be444406744f067683f2e7cde8ace6c1ef5d6b353938b0b36859ff345baff1';

      function sha256(text) {
        if (!window.crypto || !crypto.subtle) return Promise.reject(new Error('no crypto'));
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
          return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        });
      }

      if (Admin.isAuthed()) { window.location.replace('products.html'); return; }

      var root  = document.getElementById('signin');
      var form  = document.getElementById('signinForm');
      var input = document.getElementById('signinPassword');

      input.addEventListener('input', function () { root.classList.remove('is-error'); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        sha256(input.value).then(function (hash) {
          if (hash === PASSWORD_SHA256) {
            Admin.login();
            window.location.href = 'products.html';
            return;
          }
          fail();
        }, fail);
      });

      function fail() {
        input.value = '';
        root.classList.remove('is-error');
        void root.offsetWidth; /* перезапуск анимации */
        root.classList.add('is-error');
        input.focus();
      }
    })();
  </script>
</body>
</html>
